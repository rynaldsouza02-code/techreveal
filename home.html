<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECH MANTHAN 6.0 | Official Portal</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="TC1.png">
    <link rel="shortcut icon" type="image/png" href="TC1.png">

    <!-- Core Stylesheets -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="cyber-crt"></div>
    <div class="cyber-vignette"></div>
    <div class="cyber-grid"></div>

    <!-- Navigation Bar -->
    <nav class="navbar" style="position: sticky; top: 0; z-index: 100; background: rgba(3, 7, 18, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0, 243, 255, 0.2); padding: 14px 28px; display: flex; justify-content: space-between; align-items: center;">
        <div class="nav-brand" style="display: flex; align-items: center; gap: 12px;">
            <img src="TC1.png" alt="Tech Manthan Logo" style="height: 38px;">
            <span style="font-family: 'Orbitron', sans-serif; font-size: 1.15rem; font-weight: 700; color: var(--neon-cyan); letter-spacing: 1px;">TECH MANTHAN 6.0</span>
        </div>
        <div style="display: flex; align-items: center; gap: 20px;">
            <span style="font-family: 'Rajdhani', sans-serif; color: var(--text-sub); font-size: 0.9rem; font-weight: 600;">[ DEPARTMENT OF COMPUTER APPLICATIONS - BCA ]</span>
        </div>
    </nav>

    <div class="dashboard-container" style="max-width: 1280px; margin: 0 auto; padding: 25px 20px;">

        <!-- Hero Section for Home view -->
        <header class="hero" id="heroSection" style="text-align: center; padding: 40px 20px 30px; margin-bottom: 30px; background: rgba(10, 15, 30, 0.6); border-radius: 20px; border: 1px solid rgba(0, 243, 255, 0.15);">
            <div class="hero-card">
                <div class="college-badge" style="display: inline-flex; align-items: center; gap: 10px; background: rgba(0, 243, 255, 0.08); border: 1px solid rgba(0, 243, 255, 0.3); border-radius: 30px; padding: 6px 18px; margin-bottom: 16px;">
                    <span class="college-name-text" style="font-family: 'Rajdhani', sans-serif; color: var(--neon-cyan); font-weight: 700; font-size: 0.95rem;">Dr. B. B. Hegde First Grade College, Kundapura</span>
                </div>
                <div class="hero-logo-wrapper" style="margin: 15px 0;">
                    <img src="TC1.png" class="event-logo-hero" alt="Tech Manthan Logo" style="height: 110px; filter: drop-shadow(0 0 20px rgba(0,243,255,0.6));">
                </div>
                <h1 class="glitch-title" style="font-family: 'Orbitron', sans-serif; font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 900; color: #ffffff; letter-spacing: 3px; text-shadow: 0 0 25px rgba(0, 243, 255, 0.8); margin-bottom: 8px;">TECH MANTHAN 6.0</h1>
                <p class="hero-subtitle" style="font-family: 'Orbitron', sans-serif; color: var(--neon-purple); font-size: 1.1rem; font-weight: 700; letter-spacing: 2px;">DIVIDED BY ZERO, UNITED BY ONE</p>
            </div>
        </header>

        <!-- Events Catalog Section -->
        <section id="events" class="events-section" style="margin-top: 20px;">
            <div class="dashboard-header" style="margin-bottom: 25px; text-align: center;">
                <div class="dashboard-title">
                    <h2 id="catalogTitle" style="font-family: 'Orbitron', sans-serif; font-size: 1.8rem; color: var(--neon-cyan); letter-spacing: 2px; text-transform: uppercase;">Events Directory</h2>
                    <p id="catalogSubtitle" style="font-family: 'Rajdhani', sans-serif; color: var(--text-sub); font-size: 1.05rem; margin-top: 6px;">Hover mouse over any card to hear voice narration!</p>
                </div>
            </div>

            <!-- Events Grid -->
            <div class="event-grid" id="eventGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px;">
                <!-- Dynamically Populated Cards with Hover TTS Speech -->
            </div>
        </section>

    </div>

    <script src="audio.js"></script>
    <script src="home.js"></script>
</body>

</html>
